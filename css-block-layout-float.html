<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: rgba(0, 0, 0, 0.08);
            box-shadow: inset 0 0 1px red;
        }
        div{
            overflow: hidden;
            width: calc((180px + 8px * 2) * 3);
            margin: auto;
            
        }
        span{
            width: 180px;
            height: 40px;
            box-sizing: border-box;
            float: left;
            margin: 8px;
            border: 3px solid;
            line-height: 34px;
        }
        span:hover{
            background-color: pink;
        }
    </style>
</head>
<body>
    <div>
    <span>01</span>
    <span>02</span>
    <span>03</span>
    <span>04</span>
    <span>05</span>
    <span>06</span>
    <span>07</span>
    <span>08</span>
    <span>09</span>
    <span>10</span>
    <span>11</span>
    <span>12</span>
    </div>
</body>
</html>
